{"name": "Update data & deploy",
 "on": {
  "push": {"branches": ["main"]},
  "schedule": [{"cron": "30 11 * * 1-5"}, {"cron": "40 13 * * 1-5"}],
  "workflow_dispatch": {"inputs": {
    "add": {"description": "新增股票代號（空白分隔，例如 2454 2330）", "required": false, "default": ""},
    "remove": {"description": "移除股票代號（空白分隔）", "required": false, "default": ""},
    "full": {"description": "完整重抓（約 10 分鐘）", "type": "boolean", "default": false}}}
 },
 "permissions": {"contents": "write", "pages": "write", "id-token": "write"},
 "concurrency": {"group": "update-deploy", "cancel-in-progress": false},
 "jobs": {"update": {
  "runs-on": "ubuntu-latest", "timeout-minutes": 50,
  "environment": {"name": "github-pages", "url": "${{ steps.deployment.outputs.page_url }}"},
  "steps": [
   {"uses": "actions/checkout@v4"},
   {"name": "Unpack uploaded zip", "run": "shopt -s nullglob; for Z in *.zip; do echo \"unpack $Z\"; rm -rf _pkg; unzip -q -o \"$Z\" -d _pkg; R=$(find _pkg -name fetch_tw_data.py -printf '%h\\n' | head -1); if [ -n \"$R\" ]; then (cd \"$R\" && tar --exclude=./.github --exclude=./.git -cf - .) | tar -xf -; fi; rm -rf _pkg \"$Z\"; done; ls -la"},
   {"uses": "actions/setup-python@v5", "with": {"python-version": "3.11"}},
   {"name": "Fetch & cross-validate", "env": {"FINMIND_TOKEN": "${{ secrets.FINMIND_TOKEN }}", "ADD": "${{ github.event.inputs.add }}", "REMOVE": "${{ github.event.inputs.remove }}", "FULL": "${{ github.event.inputs.full }}"},
    "run": "A=(); if [ -n \"$ADD\" ]; then A+=(--add $ADD); fi; if [ -n \"$REMOVE\" ]; then A+=(--remove $REMOVE); fi; if [ \"$FULL\" = \"true\" ]; then A+=(--full); fi; python fetch_tw_data.py \"${A[@]}\" || echo \"::warning::部分資料來源抓取失敗，請查看上方紀錄\""},
   {"name": "Commit data", "run": "git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git add -A; git commit -q -m \"data: $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M') 更新\" || echo 'no changes'; git push || (git pull --rebase -X theirs && git push)"},
   {"uses": "actions/configure-pages@v5"},
   {"uses": "actions/upload-pages-artifact@v3", "with": {"path": "."}},
   {"id": "deployment", "uses": "actions/deploy-pages@v4"}
  ]}}}
